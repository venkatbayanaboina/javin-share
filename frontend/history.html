<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>JAVIN FileShare — History</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0b1220" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="stylesheet" href="assets/css/main.css" />
  <script>
    (function() {
      const t = localStorage.getItem('theme');
      if (t === 'light' || (!t && window.matchMedia('(prefers-color-scheme: light)').matches)) {
        document.documentElement.classList.add('light-theme');
      }
    })();
  </script>
</head>
<body class="page-history">
  <div class="wrap" style="max-width:800px">
    <header class="app-header rise">
      <div>
        <h1 style="margin:0;font-size:var(--text-lg)">Transfer history</h1>
        <p class="muted" style="margin:4px 0 0;font-size:var(--text-sm)">All files sent and received in this session</p>
      </div>
      <div class="app-header-actions">
        <button id="theme-toggle" type="button" title="Toggle theme" aria-label="Toggle theme"></button>
        <button id="back-btn" class="btn-secondary" type="button"><svg class="icon" style="width:14px;height:14px"><use href="assets/icons.svg#arrow-left"/></svg> Back</button>
      </div>
    </header>

    <div class="card rise">
      <div class="card-header" style="display:flex;justify-content:space-between;align-items:center">
        <span class="card-title">Transfers</span>
        <span class="pill" id="record-count">0</span>
      </div>
      <div class="table-container" style="overflow-x:auto">
        <table class="table">
          <thead>
            <tr>
              <th>Time</th>
              <th>Direction</th>
              <th>File</th>
              <th class="num">Size</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="audit-logs-body">
            <tr><td colspan="5" class="table-empty">No transfers yet.</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="assets/js/core/index.js"></script>
  <script type="module" src="assets/js/pages/history.js"></script>
</body>
</html>
