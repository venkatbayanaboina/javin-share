<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>JAVIN FileShare — Send Files</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0b1220" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="stylesheet" href="assets/css/main.css" />
  <script>
    (function() {
      const t = localStorage.getItem('theme');
      if (t === 'light' || (!t && window.matchMedia('(prefers-color-scheme: light)').matches)) {
        document.documentElement.classList.add('light-theme');
      }
    })();
  </script>
</head>
<body class="page-send">
  <div class="wrap">
    <div id="page-status" class="page-status is-hidden" role="status" aria-live="polite"></div>

    <header class="app-header rise">
      <a class="app-brand" href="/" style="text-decoration:none">
        <span class="app-brand-icon"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg></span>
        JAVIN FileShare
      </a>
      <div class="app-header-actions">
        <button id="theme-toggle" type="button" title="Toggle theme" aria-label="Toggle theme"></button>
        <span class="pill primary">Send</span>
      </div>
    </header>

    <div class="rise" style="display:flex;align-items:center;gap:8px;font-size:var(--text-sm)">
      <span class="muted">Session</span> <code id="sessionId" style="font-weight:600;color:var(--primary)"></code>
      <span class="pill primary" id="devicesStatus">0 devices</span>
    </div>

    <div id="fileDropZone" class="drop-zone rise">
      <svg class="icon icon-lg" style="color:var(--text-3)"><use href="assets/icons.svg#upload-cloud"/></svg>
      <h3 style="margin:8px 0 0">Drop files here</h3>
      <p class="muted" style="margin:4px 0 0;font-size:var(--text-sm)">or click to browse — any file type</p>
      <button type="button" class="btn-secondary browse-btn" style="margin-top:12px">Browse files</button>
      <input type="file" id="fileInput" multiple style="display:none" />
    </div>

    <div id="staged-section" class="is-hidden" style="display:flex;flex-direction:column;gap:16px">
      <div class="card">
        <div class="card-header">
          <span class="card-title">Selected files</span>
          <span class="pill primary" id="staged-count-badge">0 files</span>
        </div>
        <div id="selectedFiles" class="file-list"></div>
        <div style="display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--border-subtle);padding-top:12px;margin-top:12px;font-size:var(--text-sm)">
          <span class="muted">Ready to send</span>
          <span id="staged-stats-text" class="muted">0 files · 0 B</span>
        </div>
      </div>
      <button id="sendBtn" class="btn-primary btn-block" type="button">Send files</button>
    </div>

    <div id="response-timer" class="card card-warning is-hidden" style="text-align:center;padding:20px">
      <div class="field-label" style="color:var(--warning)">Waiting for responses</div>
      <div class="progress" style="margin:10px 0"><div class="progress-fill" id="timer-bar" style="width:100%"></div></div>
      <div class="countdown" id="timer-count">30</div>
      <p class="muted" style="font-size:var(--text-sm);margin:6px 0 14px"><span id="response-count">0</span> of <span id="total-receivers">0</span> ready</p>
      <div style="display:flex;gap:10px">
        <button type="button" id="extend-response-btn" class="btn-secondary" style="flex:1">Extend</button>
        <button type="button" id="manual-proceed-btn" class="btn-primary" style="flex:1">Send now</button>
      </div>
    </div>

    <div id="no-receivers-notification" class="card card-warning is-hidden" style="text-align:center;padding:20px">
      <h3 style="margin:0 0 6px">No receivers connected</h3>
      <p class="muted" style="margin:0 0 14px;font-size:var(--text-sm)">Connect a device before sending.</p>
      <button type="button" id="back-btn-alt" class="btn-secondary btn-block">Back to session</button>
    </div>

    <div id="upload-section" class="card is-hidden">
      <h3 id="upload-title" class="card-title" style="margin:0 0 12px;padding-bottom:8px;border-bottom:1px solid var(--border-subtle)">Upload progress</h3>
      <div id="upload-list" style="margin-bottom:14px"></div>
      <div id="upload-stats" style="display:flex;flex-wrap:wrap;gap:12px"></div>
      <div id="receiver-progress-section" class="is-hidden" style="margin-top:18px;border-top:1px solid var(--border-subtle);padding-top:14px">
        <div class="field-label" style="margin-bottom:8px">Receivers</div>
        <div id="peer-progress-list" style="display:flex;flex-direction:column;gap:10px"></div>
      </div>
    </div>

    <div class="card log-console rise" style="padding:0;overflow:hidden">
      <button type="button" class="log-console-header" id="toggle-console-btn" style="width:100%;text-align:left;background:none;border:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:12px 16px">
        <span class="field-label" style="margin:0">Activity log</span>
        <span id="toggle-console-text" class="muted" style="font-size:var(--text-xs)">Show</span>
      </button>
      <div id="console-body" class="log-console-body is-hidden" style="max-height:120px;overflow-y:auto;padding:12px 16px;font-family:var(--font-mono);font-size:var(--text-sm);line-height:1.5">
        <div><span class="muted">[System]</span> Ready to send</div>
      </div>
    </div>

    <div style="display:flex;justify-content:center">
      <button type="button" id="back-btn" class="btn-exit">Back to session</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="assets/js/core/index.js"></script>
  <script type="module" src="assets/js/pages/send-files.js"></script>
</body>
</html>
