<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>JAVIN FileShare — Join Session</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0b1220" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="stylesheet" href="assets/css/main.css" />
  <script>
    (function() {
      const t = localStorage.getItem('theme');
      if (t === 'light' || (!t && window.matchMedia('(prefers-color-scheme: light)').matches)) {
        document.documentElement.classList.add('light-theme');
      }
    })();
  </script>
</head>
<body class="page-pin">
  <div class="wrap wrap-narrow">
    <div id="page-status" class="page-status is-hidden" role="status" aria-live="polite"></div>

    <header class="app-header rise">
      <a class="app-brand" href="/" style="text-decoration:none">
        <span class="app-brand-icon"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg></span>
        JAVIN FileShare
      </a>
      <div class="app-header-actions">
        <button id="theme-toggle" type="button" title="Toggle theme" aria-label="Toggle theme"></button>
      </div>
    </header>

    <div class="card rise" style="display:flex;flex-direction:column;gap:20px;padding:24px">
      <header style="text-align:center;padding-bottom:16px;border-bottom:1px solid var(--border-subtle)">
        <h2 style="margin:0">Join session</h2>
        <p id="header-description" class="muted" style="margin:6px 0 0;font-size:var(--text-sm)">Enter your name and the 6-digit PIN from the host</p>
      </header>

      <form id="pin-form" style="display:flex;flex-direction:column;gap:16px">
        <label class="field">
          <span class="field-label">Your device name</span>
          <input type="text" id="device-name" placeholder="e.g. My Phone" maxlength="30" autocomplete="nickname" required />
        </label>

        <div class="field">
          <span class="field-label">Session PIN</span>
          <div class="multi-pin-container" style="display:flex;gap:8px">
            <input class="pin-digit" type="text" inputmode="numeric" maxlength="1" autocomplete="off" aria-label="PIN digit 1" />
            <input class="pin-digit" type="text" inputmode="numeric" maxlength="1" autocomplete="off" aria-label="PIN digit 2" />
            <input class="pin-digit" type="text" inputmode="numeric" maxlength="1" autocomplete="off" aria-label="PIN digit 3" />
            <input class="pin-digit" type="text" inputmode="numeric" maxlength="1" autocomplete="off" aria-label="PIN digit 4" />
            <input class="pin-digit" type="text" inputmode="numeric" maxlength="1" autocomplete="off" aria-label="PIN digit 5" />
            <input class="pin-digit" type="text" inputmode="numeric" maxlength="1" autocomplete="off" aria-label="PIN digit 6" />
          </div>
          <input type="hidden" id="pin-input" />
          <span id="pin-timer" class="muted" style="font-size:var(--text-xs);margin-top:4px;display:block"></span>
        </div>

        <button id="connect-btn" class="btn-primary btn-block" type="submit">Join session</button>
      </form>

      <div id="error-message" class="banner banner-danger is-hidden" role="alert"></div>
      <div id="status-message" class="banner banner-primary is-hidden"></div>

      <div style="text-align:center;font-size:var(--text-sm);border-top:1px solid var(--border-subtle);padding-top:14px">
        <span class="muted">Want to host instead?</span> <a href="/host.html">Create a session</a>
      </div>
    </div>

    <div id="popupMessage" class="modal-overlay is-hidden">
      <div class="modal-card">
        <button type="button" id="popupClose" style="display:none" aria-label="Close"></button>
        <div class="modal-icon"><svg class="icon"><use href="assets/icons.svg#check-circle"/></svg></div>
        <h2 id="popupTitle" class="modal-title">Connected</h2>
        <p id="popupBody" class="modal-text">Joining session…</p>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="assets/js/core/index.js"></script>
  <script type="module" src="assets/js/pages/join-pin.js"></script>
</body>
</html>
